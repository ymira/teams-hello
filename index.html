<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello World</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--fg:#242424;--muted:#616161;--line:#e0e0e0;--accent:#5b5fc7;--err:#c4314b}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1f;--card:#292929;--fg:#fff;--muted:#adadad;--line:#3d3d3d;--accent:#7f85f5;--err:#f1707b}}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:860px;margin:0 auto;padding:24px 16px}
h1{font-size:1.8rem;margin:0 0 4px}.muted{color:var(--muted);font-size:.9rem;margin:0}
.status{margin:16px 0;color:var(--muted)}.status.error{color:var(--err)}
button{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:8px 16px;font:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:20px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);min-width:0;flex:1;max-width:260px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}
</style></head>
<body><main>
<h1 id="hello">Hello World 👋</h1>
<p class="muted" id="name"></p><p class="muted" id="host"></p>
<p class="status" id="status">Loading…</p>
<button id="signin" hidden>Sign in</button>
<section class="card" id="results" hidden>
  <div class="bar"><strong id="count"></strong><input id="filter" placeholder="Filter groups…" aria-label="Filter groups"></div>
  <div class="scroll"><table><thead><tr><th>Group</th><th>Type</th><th>Email</th></tr></thead><tbody id="groups"></tbody></table></div>
</section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
